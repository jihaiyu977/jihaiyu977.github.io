<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Страница не найдена — Kailin International</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#050e1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans SC',sans-serif;font-weight:300;
  background:#050e1f;color:#e8eef8;line-height:1.7;
  min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.code{font-family:'Bebas Neue',sans-serif;font-size:96px;line-height:1;letter-spacing:6px;color:#3a9af8}
h1{font-size:22px;font-weight:500;margin:18px 0 10px}
p{font-size:15px;color:#8ea8cc;max-width:520px;margin:0 auto 32px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a.btn{
  background:#1565c8;color:#fff;text-decoration:none;
  padding:13px 30px;font-size:14px;letter-spacing:1.5px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);
}
a.btn.alt{background:transparent;color:#3a9af8;border:1px solid rgba(30,122,224,.5);clip-path:none}
@media(max-width:600px){.code{font-size:68px}h1{font-size:19px}a.btn{width:100%;max-width:280px}}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Возможно, адрес указан с ошибкой или страница была перемещена. Вернитесь на главную страницу — там вся информация о солнечных водяных насосах и системах водоснабжения.</p>
  <div class="links">
    <a class="btn" href="/">На главную</a>
    <a class="btn alt" href="/#contact">Связаться с нами</a>
  </div>
</main>
</body>
</html>
